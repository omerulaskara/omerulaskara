<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520" preserveAspectRatio="xMidYMid meet" role="img" aria-label="ulaskara@studio whoami terminal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">

  <!-- window background -->
  <rect x="0" y="0" width="820" height="520" rx="10" ry="10" fill="#0d0d14"/>
  <rect x="0.5" y="0.5" width="819" height="519" rx="9.5" ry="9.5" fill="none" stroke="rgba(255,255,255,0.08)"/>

  <!-- title bar -->
  <path d="M10,0 L810,0 Q820,0 820,10 L820,40 L0,40 L0,10 Q0,0 10,0 Z" fill="#07070b"/>
  <line x1="0" y1="40" x2="820" y2="40" stroke="rgba(255,255,255,0.08)"/>

  <!-- traffic lights -->
  <circle cx="22" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="20" r="6" fill="#27c93f"/>

  <!-- title bar text -->
  <text x="410" y="25" text-anchor="middle" font-size="12" fill="rgba(230,225,211,0.55)">
    <tspan>ulaskara@studio</tspan><tspan fill="rgba(230,225,211,0.35)">:</tspan><tspan fill="rgba(230,225,211,0.78)"> ~/portfolio</tspan>
  </text>

  <!-- tab bar -->
  <line x1="0" y1="76" x2="820" y2="76" stroke="rgba(255,255,255,0.08)"/>
  <text x="22" y="62" font-size="11" fill="rgba(230,225,211,0.55)">
    <tspan fill="rgba(230,225,211,0.35)">01</tspan>
    <tspan dx="6" fill="#e6e1d3">whoami</tspan><tspan fill="#62c4ff">.sh</tspan>
  </text>
  <line x1="20" y1="76" x2="115" y2="76" stroke="#62c4ff" stroke-width="2"/>
  <text x="135" y="62" font-size="11" fill="rgba(230,225,211,0.35)">02 stats.json</text>
  <text x="240" y="62" font-size="11" fill="rgba(230,225,211,0.35)">03 domains.json</text>
  <text x="362" y="62" font-size="11" fill="rgba(230,225,211,0.35)">04 projects.gitlog</text>
  <text x="500" y="62" font-size="11" fill="rgba(230,225,211,0.35)">05 stack.json</text>
  <text x="605" y="62" font-size="11" fill="rgba(230,225,211,0.35)">06 arch.tree</text>
  <text x="700" y="62" font-size="11" fill="rgba(230,225,211,0.35)">07 security</text>

  <!-- terminal content -->
  <g transform="translate(28, 120)">

    <!-- prompt + command (always visible) -->
    <text font-size="14" y="0" fill="#e6e1d3">
      <tspan fill="#d9b86b">ulaskara</tspan><tspan fill="rgba(230,225,211,0.45)">@</tspan><tspan fill="#d9b86b">studio</tspan>
      <tspan dx="8" fill="#62c4ff" font-weight="700">❯</tspan>
      <tspan dx="6" fill="#e6e1d3">whoami</tspan>
    </text>

    <!-- row 1: name -->
    <g transform="translate(0, 36)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="0.8s" fill="freeze"/>
      <text font-size="13.5" y="0" fill="#e6e1d3">
        <tspan fill="#c4a5ff">name</tspan>
        <tspan dx="6" fill="rgba(230,225,211,0.55)">=</tspan>
        <tspan dx="6">Ömer Ulaş </tspan><tspan fill="#d9b86b">Kara</tspan>
      </text>
    </g>

    <!-- row 2: role -->
    <g transform="translate(0, 60)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="1.2s" fill="freeze"/>
      <text font-size="13.5" y="0" fill="#e6e1d3">
        <tspan fill="#c4a5ff">role</tspan>
        <tspan dx="6" fill="rgba(230,225,211,0.55)">=</tspan>
        <tspan dx="6">Senior Full-Stack Developer </tspan><tspan fill="rgba(230,225,211,0.55)">·</tspan><tspan> Founding Developer</tspan>
      </text>
    </g>

    <!-- row 3: location -->
    <g transform="translate(0, 84)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="1.6s" fill="freeze"/>
      <text font-size="13.5" y="0" fill="#e6e1d3">
        <tspan fill="#c4a5ff">location</tspan>
        <tspan dx="6" fill="rgba(230,225,211,0.55)">=</tspan>
        <tspan dx="6">Istanbul, Türkiye</tspan>
      </text>
    </g>

    <!-- row 4: domains -->
    <g transform="translate(0, 108)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="2.0s" fill="freeze"/>
      <text font-size="13.5" y="0" fill="#e6e1d3">
        <tspan fill="#c4a5ff">domains</tspan>
        <tspan dx="6" fill="rgba(230,225,211,0.55)">=</tspan>
        <tspan dx="6">Legal Tech </tspan><tspan fill="rgba(230,225,211,0.55)">·</tspan>
        <tspan> Telephony </tspan><tspan fill="rgba(230,225,211,0.55)">·</tspan>
        <tspan> Mobile </tspan><tspan fill="rgba(230,225,211,0.55)">·</tspan>
        <tspan> AI/RAG</tspan>
      </text>
    </g>

    <!-- row 5: ships -->
    <g transform="translate(0, 132)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="2.4s" fill="freeze"/>
      <text font-size="13.5" y="0" fill="#e6e1d3">
        <tspan fill="#c4a5ff">ships</tspan>
        <tspan dx="6" fill="rgba(230,225,211,0.55)">=</tspan>
        <tspan dx="6" fill="#c4e890">"WebRTC SaaS · UYAP automation · Social art network"</tspan>
      </text>
    </g>

    <!-- row 6: stack -->
    <g transform="translate(0, 156)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="2.8s" fill="freeze"/>
      <text font-size="13.5" y="0" fill="#e6e1d3">
        <tspan fill="#c4a5ff">stack</tspan>
        <tspan dx="6" fill="rgba(230,225,211,0.55)">=</tspan>
        <tspan dx="6">TypeScript </tspan><tspan fill="rgba(230,225,211,0.55)">·</tspan>
        <tspan> NestJS </tspan><tspan fill="rgba(230,225,211,0.55)">·</tspan>
        <tspan> Next.js </tspan><tspan fill="rgba(230,225,211,0.55)">·</tspan>
        <tspan> React Native </tspan><tspan fill="rgba(230,225,211,0.55)">·</tspan>
        <tspan> Postgres</tspan>
      </text>
    </g>

    <!-- row 7: production -->
    <g transform="translate(0, 180)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="3.2s" fill="freeze"/>
      <text font-size="13.5" y="0" fill="#e6e1d3">
        <tspan fill="#c4a5ff">production</tspan>
        <tspan dx="6" fill="rgba(230,225,211,0.55)">=</tspan>
        <tspan dx="6" fill="#c4e890">"ccp.stroke-app.com · stroke-app.com · Sprint 19"</tspan>
      </text>
    </g>

    <!-- row 8: available -->
    <g transform="translate(0, 204)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="3.6s" fill="freeze"/>
      <text font-size="13.5" y="0" fill="#e6e1d3">
        <tspan fill="#c4a5ff">available</tspan>
        <tspan dx="6" fill="rgba(230,225,211,0.55)">=</tspan>
        <tspan dx="6" fill="#ff9ec7">true</tspan>
        <tspan dx="10" fill="rgba(230,225,211,0.45)"># Remote · Freelance · Founding roles</tspan>
      </text>
    </g>

    <!-- row 9: comment -->
    <g transform="translate(0, 240)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="4.0s" fill="freeze"/>
      <text font-size="13" y="0" fill="rgba(230,225,211,0.45)">// session active — awaiting command</text>
    </g>

    <!-- next prompt + blinking cursor -->
    <g transform="translate(0, 276)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="4.5s" fill="freeze"/>
      <text font-size="14" y="0" fill="#e6e1d3">
        <tspan fill="#d9b86b">ulaskara</tspan><tspan fill="rgba(230,225,211,0.45)">@</tspan><tspan fill="#d9b86b">studio</tspan>
        <tspan dx="8" fill="#62c4ff" font-weight="700">❯</tspan>
      </text>
      <!-- blinking cursor block -->
      <rect x="138" y="-12" width="8" height="15" fill="#d9b86b">
        <animate attributeName="opacity" values="1;0;1;0;1;0;1;0" dur="1.2s" begin="4.7s" repeatCount="indefinite"/>
      </rect>
    </g>

  </g>

  <!-- status bar -->
  <line x1="0" y1="490" x2="820" y2="490" stroke="rgba(255,255,255,0.08)"/>
  <path d="M0,490 L820,490 L820,510 Q820,520 810,520 L10,520 Q0,520 0,510 Z" fill="#07070b"/>
  <text x="22" y="508" font-size="11" fill="rgba(230,225,211,0.55)">
    <tspan fill="#62c4ff">⎇ main</tspan>
    <tspan dx="14">UTF-8</tspan>
    <tspan dx="14" fill="#d9b86b">17 repos</tspan>
    <tspan dx="14" fill="#7ed99a">● Sprint 19</tspan>
  </text>
  <text x="798" y="508" font-size="11" fill="rgba(230,225,211,0.55)" text-anchor="end">İstanbul · TR</text>

</svg>
